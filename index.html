document.addEventListener('click',e=>{if(swallow){swallow=false;e.preventDefault();e.stopPropagation();return}const b=e.target.closest('[data-act]');if(b)onAct(b)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){closeSheet();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();onAct(e.target)}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form;
  if(k==='qedit'){qsave(document.getElementById('qinput').value);return}
  if(k==='padd'){const n=document.getElementById('p-name').value.trim().slice(0,24);if(!n)return;const ps=people(),used=ps.map(p=>p.c),c=Object.keys(PCOL).find(x=>!used.includes(x))||'sage';
    patch('settings/house',{people:ps.concat([{id:uid(),n,c}])},{});setTimeout(()=>focusIn('p-name'),30);return}
  if(k==='feed'){const v=document.getElementById('feed-url').value.trim();if(v&&!/^https:\/\//.test(v)){S.err='The feed link should start with https://';render();return}applyFeed(v);return}
  if(k==='cals'){lsSet('hub-cals',document.getElementById('cal-ids').value.trim());CAL_IDS=loadCals();const cs=document.getElementById('calsheet');cs.dataset.mounted='';cs.innerHTML='';S.flash='cals';render();return}
  if(k==='mailadd'){const em=document.getElementById('mail-addr').value.trim(),nm=document.getElementById('mail-name').value.trim();
    if(!validEmail(em)){S.err='That email address doesn\u2019t look right. Check it and save again.';render();focusIn('mail-addr');return}
    const people=(settingsDoc().emails||[]).filter(p=>p.email.toLowerCase()!==em.toLowerCase()).concat([{name:nm.slice(0,60),email:em.slice(0,200)}]);
    S.err=null;S.mail.to=S.mail.to.concat([em]);document.getElementById('mail-addr').value='';document.getElementById('mail-name').value='';patch('settings/house',{emails:people},{});document.activeElement&&document.activeElement.blur&&document.activeElement.blur();return}
  const inp=f.querySelector('input'),t=inp.value.trim();if(!t)return;inp.value='';
  patch('lists/house',{[k]:(listsData()[k]||[]).concat([{id:uid(),t:t.slice(0,200),done:false}])},{})});
const timers={};
function flush(el){clearTimeout(timers[el.id]);delete timers[el.id];const path=el.dataset.in,key=el.dataset.key,v=el.value.slice(0,2000);
  if((dig(C[path]||{},key)||'')===v)return;patch(path,nest(key,v),weekBase(path.split('/')[1]))}
document.addEventListener('input',e=>{const el=e.target;if(el.id==='skyprev'){S.previewMin=+el.value;paintSky();const l=document.getElementById('prevlbl');if(l)l.textContent=fmtTime(skyNow().getTime())+' \u00b7 '+sunLabel(skyNow());return}if(!el.dataset||!el.dataset.in)return;clearTimeout(timers[el.id]);timers[el.id]=setTimeout(()=>{const n=document.getElementById(el.id);if(n)flush(n)},800)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.in)flush(el)});
async function toggleWake(){try{if(S.wake){S.wakeWanted=false;await S.wake.release();S.wake=null}else{S.wakeWanted=true;S.wake=await navigator.wakeLock.request('screen');S.wake.addEventListener('release',()=>{S.wake=null;render()})}}catch(e){S.wake=null}render()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();if(S.wakeWanted&&!S.wake)toggleWake()}});

(function(){const st=document.getElementById('stars');let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;let h='';
  for(let i=0;i<90;i++){const o=(.25+rnd()*.75).toFixed(2),z=rnd()<.12?3:2;h+='<i style="left:'+(rnd()*100).toFixed(2)+'%;top:'+(rnd()*72).toFixed(2)+'%;opacity:'+o+';width:'+z+'px;height:'+z+'px"></i>'}st.innerHTML=h})();

paintSky();render();setInterval(tick,15000);setInterval(timerTick,1000);
loadWx();setInterval(loadWx,20*60*1000);
const b64u=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function pullProfile(){const key=lsGet('hub-pkey','');if(!key||!(window.crypto&&crypto.subtle))return;
  try{const r=await fetch('profile.enc',{cache:'no-store'});if(!r.ok)return;const e=await r.json();
    const k=await crypto.subtle.importKey('raw',b64u(key),'AES-GCM',false,['decrypt']);
    const x=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(e.iv)},k,b64u(e.ct))));
    let cur=null;try{cur=JSON.parse(lsGet('hub-profile','null'))}catch(_){}
    if(!okProfile(x)||(cur&&(cur.rev||0)>=(x.rev||0)))return;
    const moved=!cur||JSON.stringify(cur.loc)!==JSON.stringify(x.loc);lsSet('hub-profile',JSON.stringify(x));applyProfile(merge(clone(GENERIC),x));
    if(moved){WX=null;lsSet('hub-wx','');WXstate='loading';loadWx().then(render)}if(!S.sheet)render()}catch(e){}}
if(!INART&&location.protocol==='https:'){let built=null;pullProfile();const chk=async()=>{try{const r=await fetch('version.txt',{cache:'no-store'});if(!r.ok)return;const v=(await r.text()).trim();
    if(built===null){built=v;return}
    if(v!==built&&!S.sheet&&!S.timers.length&&!S.ring&&!scanStream&&Date.now()-lastAct>120000&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))location.reload()}catch(e){}};
  chk();setInterval(()=>{chk();pullProfile()},10*60*1000)}
startCalendar();
if(!INART){loadFeed();setInterval(()=>{if(document.visibilityState==='visible')loadFeed()},15*60*1000)}
if(!INART)setInterval(()=>{const f=document.getElementById('calframe');if(f&&document.visibilityState==='visible')f.src=embedUrl()},30*60*1000);
(async()=>{
  let db=null;try{db=INART?await window.claude.use('db'):null}catch(e){db=null}
  store=db||makeLocal();shared=!!db;S.ready=true;syncSubs();watchBattery();
  store.collection('prep').onSnapshot(s=>{s.docs.forEach(d=>{if(!T.has('prep/'+d.id))C['prep/'+d.id]=clone(d.data())});render()},onErr);
  store.doc('settings/house').onSnapshot(s=>{if(s.exists&&!T.has('settings/house'))C['settings/house']=clone(s.data());render()},onErr);
  store.doc('lists/house').onSnapshot(s=>{if(s.exists&&!T.has('lists/house'))C['lists/house']=clone(s.data());render()},onErr);
  render()})();
})();
