<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home Support Hub</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1430">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@200;300;500&display=swap">
<style>
/* Layout: a fixed one-screen tile board over a living sky. Row 1 answers "what time / what weather / what's today",
   row 2 answers "what do I do right now / what's coming / what's left", row 3 is the week, then a glass dock.
   Taps open glass sheets with the full detail. On a phone or a portrait tablet the tiles stack and scroll. */
:root{
  --ink:#FFFFFF; --muted:rgba(255,255,255,.88); --faint:rgba(255,255,255,.52); --line:rgba(255,255,255,.16);
  --glass:rgba(12,18,36,.34); --glass-strong:rgba(14,20,40,.78); --chip:rgba(255,255,255,.12);
  --bins:#F7C85C; --clean:#72E3C6; --hm:#AFC2FF; --prep:#FFB48C; --clothes:#F3A6D6; --done:#78EBA9; --warn:#FFA08A;
  --ui:"Figtree", system-ui, "Segoe UI", sans-serif;
  --round:ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, system-ui, sans-serif;
  --r:28px; --r-lg:28px; --r-md:18px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:#0d1430;color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 20px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- the sky: changes with the time of day, dims with clouds and rain ---------- */
.sky{position:fixed;inset:0;z-index:-2;transition:background 3s ease}
.sky{background:linear-gradient(165deg,var(--s1,#1a46a3) 0%,var(--s2,#2f74cf) 52%,var(--s3,#5d9edd) 100%)}
.sky::before{content:"";position:absolute;inset:0;background:
  radial-gradient(38% 34% at 16% 20%, var(--b1,rgba(120,200,255,.5)), transparent 72%),
  radial-gradient(34% 30% at 86% 26%, var(--b2,rgba(140,120,255,.36)), transparent 72%),
  radial-gradient(46% 40% at 58% 92%, var(--b3,rgba(80,190,220,.45)), transparent 72%)}
.sky .stars,.sky .horizon,.sky .sunglow{position:absolute;inset:0;pointer-events:none}
.sky .stars{opacity:var(--starA,0);transition:opacity 4s}
.sky .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
.sky .horizon{background:linear-gradient(0deg,var(--hz,transparent) 0%,transparent 42%)}
.sky .sunglow{background:radial-gradient(circle at var(--sx,80%) var(--sy,30%),var(--sc0,transparent) 0,var(--sc1,transparent) 7vmin,var(--sc2,transparent) 26vmin,transparent 55vmin)}
.veil{position:fixed;inset:0;z-index:-1;pointer-events:none;background:rgba(40,50,70,0);transition:background 3s ease}
.veil::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,20,50,.26),transparent 46%),linear-gradient(0deg,rgba(10,20,50,.24),transparent 38%)}
.veil.cloudy{background:rgba(52,62,84,.26)} .veil.wet{background:rgba(34,46,70,.38)}

/* ---------- liquid glass ---------- */
.glass{position:relative;border-radius:var(--r);
  background:linear-gradient(155deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 42%,rgba(255,255,255,.02)),var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid rgba(255,255,255,.2);border-top-color:rgba(255,255,255,.44);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.05),0 12px 32px rgba(3,6,18,.26)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 70% at 12% -18%,rgba(255,255,255,.2),transparent 52%),radial-gradient(80% 50% at 100% 120%,rgba(255,255,255,.06),transparent 60%)}
.glass > *{position:relative;z-index:1}
.lite .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(155deg,rgba(255,255,255,.12),rgba(255,255,255,.03)),rgba(16,24,46,.6)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(16,24,46,.66)}}
@media (prefers-reduced-transparency:reduce){.glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(16,24,46,.86)}}

/* ---------- home board ---------- */
.home{display:grid;grid-template-columns:372px minmax(0,1fr);gap:34px;max-width:1500px;margin:0 auto;
  height:calc(100dvh - 100px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));min-height:560px;padding:8px 4px 0}
.tile{padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;overflow:hidden}
.tile.tap{cursor:pointer;text-align:left;transition:transform .15s ease}
.tile.tap:active{transform:scale(.985)}
.th{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.th h2{font-size:clamp(22px,2.2vw,28px);line-height:1.1;margin-top:4px}
.th .sub{color:var(--muted);font-size:14px;margin-top:2px}
.tf{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.chev{color:var(--faint);font-size:22px;line-height:1}

.t-clock{grid-area:clock;justify-content:space-between;gap:8px}
.time{font-family:var(--round);font-weight:700;font-size:clamp(72px,9vw,150px);line-height:.88;letter-spacing:-.045em;font-variant-numeric:tabular-nums;white-space:nowrap}
.time .ap{font-size:.26em;letter-spacing:0;margin-left:.18em;color:var(--muted);font-weight:700}
.date{font-size:clamp(20px,2.3vw,30px);font-weight:600;line-height:1.15}
.sunarc svg{width:100%;height:auto;display:block;max-height:54px}
.sunarc .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.moon{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:6px}
.moon svg{width:20px;height:20px;flex:none}

.t-wx{grid-area:wx;gap:10px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wxmain{display:flex;align-items:center;gap:14px}
.wxmain svg{width:62px;height:62px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.wxmain .tmp{font-family:var(--round);font-size:clamp(50px,5.4vw,80px);font-weight:700;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.wxmain .cond{display:flex;flex-direction:column;gap:2px;min-width:0}
.wxmain .cond b{font-size:18px;line-height:1.15}
.wxmain .cond span{font-size:14px}
.hrs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;text-align:center;font-variant-numeric:tabular-nums;background:var(--chip);border-radius:18px;padding:6px 4px;flex:none}
.hrs .h{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.hrs svg{width:24px;height:24px}
.hrs b{font-size:16px}
.hrs .pp{font-size:11px;font-weight:700;color:#BFE1FF;min-height:14px}
button.hrs{border:0;color:inherit;font:inherit;cursor:pointer;width:100%}
.hrs .lo{font-size:13px;color:var(--muted);font-weight:600}
.hrs.days .h{gap:1px}
.status.batt.low{color:var(--warn)}
.dress{display:flex;gap:10px;align-items:center;background:var(--chip);border-radius:16px;padding:8px 12px;margin-top:auto;flex:none}
.dress svg{width:26px;height:26px;flex:none}
.dress b{display:block;font-size:14px;line-height:1.25}

.t-today{grid-area:today}
.focus{font-family:var(--round);font-size:clamp(24px,2.5vw,36px);font-weight:800;line-height:1.05;letter-spacing:-.01em}
.kv{display:flex;flex-direction:column;gap:8px}
.kv div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.kv b{font-size:16px;overflow-wrap:anywhere;font-weight:600}
.kv b.empty{color:var(--faint);font-weight:400}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,#fff)}

.t-now{grid-area:now}
.t-now .list{overflow:auto;margin:0 -6px;flex:1;min-height:0}
.t-next{grid-area:next}
.t-next .cols{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;overflow:auto}
.nowgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;flex:1;min-height:0}
.nowmain{display:flex;flex-direction:column;min-height:0}
.nowside{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;border-left:1px solid var(--line);padding-left:22px}
.nowside .tf{margin-top:auto;padding-top:6px}
.mustdo{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;border-left:4px solid var(--warn);background:var(--chip);border-radius:6px 14px 14px 6px;padding:10px 14px;cursor:pointer;flex:none;min-width:0;min-height:56px}
.mustdo span{font-size:12px;font-weight:700;color:var(--muted)}
.mustdo.unset{border-left-color:var(--line)}
.mustdo.unset b{color:var(--muted);font-weight:600}
.mustdo b{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.mustdo b.empty{color:var(--muted);font-weight:400;font-size:15px}
.alsoh{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);flex:none;margin-top:4px}
.alsos{display:flex;flex-direction:column;gap:6px;flex:none}
.also{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:14px;background:var(--chip);padding:8px 12px;font-size:15px;font-weight:600;cursor:pointer;min-height:50px}
.also .chev{color:var(--faint);font-size:20px;line-height:1}
.also .n{margin-left:auto}
.also::before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p)*1%);background:var(--pb);opacity:.28}
.also > *{position:relative}
.also .dot{background:var(--pi)}
.also .n{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.also.full span:not(.n):not(.av):not(.dot):not(.chev){text-decoration:line-through;color:var(--muted)}
.also.full .n{color:var(--done)}
.t-now .tf{justify-content:flex-start;gap:8px}
.t-week{grid-area:week;padding:14px}
.dock{grid-area:dock}

/* rings, checks, rows */
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--done) calc(var(--p)*1%),rgba(255,255,255,.18) 0)}
.ring span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(12,18,36,.55);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:2px}
.list > *{flex:none}
.ck{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;padding:9px 8px;border-radius:14px;cursor:pointer;min-height:48px}
.ck:hover{background:rgba(255,255,255,.08)}
.ck .box{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.62);display:grid;place-items:center;transition:background .18s,border-color .18s,transform .18s}
.ck .box svg{width:17px;height:17px;opacity:0;transform:scale(.5);transition:opacity .18s,transform .18s}
.ck.on .box{background:var(--done);border-color:var(--done)}
.ck.on .box svg{opacity:1;transform:none}
.ck:active .box{transform:scale(.9)}
.ck .lbl{padding-top:3px;min-width:0;overflow-wrap:anywhere;font-weight:600}
.ck.on .lbl{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.ck small{display:block;color:var(--muted);font-size:13px;font-weight:400;text-decoration:none}
.pillbtn{border:0;background:var(--chip);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:40px}
.pillbtn:hover{background:rgba(255,255,255,.2)}
.pillbtn.warn{color:var(--warn)}

.agenda{display:flex;flex-direction:column}
.agenda .dh{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:10px 0 4px}
.agenda .dh:first-child{padding-top:0}
.ev{display:grid;grid-template-columns:12px 5.2em minmax(0,1fr);gap:12px;padding:11px 0;font-size:17px;border-top:1px solid var(--line);align-items:baseline}
.ev .dot{align-self:center}
.ev .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;font-weight:700}
.ev .tt{font-weight:600;overflow-wrap:anywhere}
.ev .tt small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.ev.past{opacity:.45}
.ev.none{grid-template-columns:1fr;color:var(--faint);font-size:14px}

.jobs{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.job{display:flex;flex-direction:column;gap:6px}
.job .row{width:100%;display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:15px}
.job .row span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{display:block;width:100%;height:6px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--c,#fff)}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:100%}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:18px;border:0;background:transparent;cursor:pointer;min-width:0}
.wd:hover{background:rgba(255,255,255,.08)}
.wd.is-today{background:rgba(255,255,255,.16)}
.wd .d1{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wd .d2{font-family:var(--round);font-weight:700;font-size:20px;line-height:1}
.wd .mini{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--done) calc(var(--p)*1%),rgba(255,255,255,.18) 0);display:grid;place-items:center}
.wd .mini i{width:22px;height:22px;border-radius:50%;background:rgba(12,18,36,.6)}
.wd .dots{display:flex;gap:3px;min-height:8px}
.wd .din{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);transform:translate(calc(-50% + var(--px,0px)),var(--py,0px));transition:transform 3s ease;z-index:45;display:flex;gap:2px;padding:4px;border-radius:999px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.dock button{position:relative;display:flex;align-items:center;gap:7px;padding:0 16px;min-height:46px;border:0;background:transparent;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink)}
.dock button[aria-current="true"]{background:rgba(255,255,255,.22)}
.dock svg{width:18px;height:18px}
.dock{transition:transform 3s ease,opacity 1.2s ease}
.dock.idle{opacity:.38}
.dock .badge{position:static;min-width:18px;height:18px;font-size:11px}
.badge{position:absolute;top:4px;right:14px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--warn);color:#2a0d06;font-size:11px;font-weight:800;display:grid;place-items:center}
.status{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top, 0px) + 10px);z-index:60;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(4,7,18,.38)}
.sheet{position:fixed;z-index:41;left:50%;transform:translateX(-50%);
  top:calc(env(safe-area-inset-top, 0px) + 20px);bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);
  width:min(1120px, calc(100vw - 24px));display:flex;flex-direction:column;border-radius:var(--r-lg);animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet.glass{--glass:rgba(14,26,60,.62)}
.sheet:focus{outline:0}
@keyframes up{from{transform:translate(-50%,24px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.sheethead{display:flex;align-items:center;gap:10px;padding:16px 18px 14px 24px;border-bottom:1px solid var(--line)}
.sheethead h2{font-family:"Outfit",var(--ui);font-weight:300;font-size:34px;flex:1;min-width:0;letter-spacing:-.01em}
.sheethead h2 small{display:block;font-family:var(--ui);font-size:16px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:2px}
.iconbtn{width:52px;height:52px;flex:none;border:0;border-radius:50%;background:var(--chip);cursor:pointer;font-size:20px;display:grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.22)}
.sheetbody{overflow:auto;padding:20px 22px 36px;-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent);display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch;min-height:0;flex:1}
.calframe{width:100%;flex:1;min-height:480px;border:0;border-radius:20px;background:#fff}

/* content inside sheets */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px;align-items:stretch}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card h3{font-size:19px}
.card .count{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);white-space:nowrap}
.card .count.full{color:var(--done)}
.card.c-bins{background:rgba(247,200,92,.12);border-color:rgba(247,200,92,.3)}
.card.c-clean{background:rgba(114,227,198,.11);border-color:rgba(114,227,198,.3)}
.card.c-clothes{background:rgba(243,166,214,.11);border-color:rgba(243,166,214,.3)}
.card.c-hm{background:rgba(175,194,255,.12);border-color:rgba(175,194,255,.32)}
.card.c-prep{background:rgba(255,180,140,.11);border-color:rgba(255,180,140,.3)}
.note{font-size:14px;color:var(--muted)}
.big .ck{min-height:60px;font-size:20px}
.big .ck .box{width:34px;height:34px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.strip > div{background:rgba(255,255,255,.07);border-radius:18px;padding:12px 14px;min-width:0}
.strip b{display:block;font-size:17px;overflow-wrap:anywhere}
.strip b.empty{color:var(--faint);font-weight:400;font-size:15px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px 22px;padding-top:6px}
.rules p{margin:0;font-size:14px;color:var(--muted)}
.rules b{color:var(--ink)}
.plan{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:150px repeat(3,minmax(0,1fr));gap:10px;align-items:center;background:rgba(255,255,255,.07);border-radius:20px;padding:12px 14px}
.prow.is-today{box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.prow .dn{font-weight:700;font-size:17px}
.prow .dn small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
input[type=text],textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;width:100%;min-height:44px}
input[type=text]:focus,textarea:focus{border-color:rgba(255,255,255,.5);outline:none;background:rgba(255,255,255,.14)}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--chip);border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:700}
.chip[aria-pressed="true"]{background:var(--hm);color:#101a3a}
.addrow{display:flex;gap:8px}
.addrow button{flex:none;border:0;background:#fff;color:#101a3a;border-radius:14px;padding:0 18px;font-weight:700;cursor:pointer;min-height:44px}
.li{display:flex;align-items:center;gap:4px}
.li .ck{flex:1}
.x{flex:none;width:48px;height:48px;border:0;background:transparent;border-radius:12px;cursor:pointer;color:var(--faint);font-size:20px}
.x:hover{background:rgba(255,255,255,.1);color:var(--warn)}
.empty{color:var(--faint);font-size:15px;padding:4px 2px}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:#fff;color:#101a3a}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}

/* ---------- quick edits, carry-over, groups, night clock, email ---------- */
.kv{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.t-today{gap:10px}
.t-today .tags{flex:none;flex-wrap:nowrap;overflow:hidden;mask-image:linear-gradient(90deg,#000 85%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
.t-today .qf{min-height:46px;padding:8px 12px}
.qf{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:var(--chip);border-radius:16px;padding:10px 14px;cursor:pointer;width:100%;min-height:52px}
.qf:hover{background:rgba(255,255,255,.18)}
.qf span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.qf b{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.qf b.empty{color:var(--muted)}
.pillbtn.sm{min-height:44px;padding:8px 14px;font-size:14px}
.primary{border:0;background:#fff;color:#101a3a;border-radius:999px;padding:10px 22px;font-weight:800;cursor:pointer;min-height:44px}
a.primary{text-decoration:none;display:inline-flex;align-items:center}
.sheet.small{top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(620px, calc(100vw - 24px));max-height:calc(100dvh - 40px);animation:pop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translate(-50%,-47%) scale(.97);opacity:.4}to{transform:translate(-50%,-50%);opacity:1}}
.qform{display:flex;flex-direction:column;gap:14px}
.qform input[type=text]{font-size:20px;min-height:54px}
.qchips{display:flex;flex-wrap:wrap;gap:8px}
.qbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.carryh{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:6px 8px 2px}
.ck.carry .box{border-color:var(--warn)}
.alldone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.alldone svg{width:64px;height:64px}
.alldone b{font-size:20px}
.job{border:0;background:transparent;text-align:left;padding:8px 10px;margin:0 -10px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:calc(100% + 20px)}
.job:hover{background:rgba(255,255,255,.08)}
.one{grid-template-columns:1fr}
.ambient{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  background:rgba(2,4,12,.8);padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));cursor:pointer}
.ambient .time{font-size:clamp(100px,15vw,220px);color:rgba(255,255,255,.78)}
.ambient .date{color:var(--muted)}
.amb-card{padding:18px 24px;min-width:min(520px,100%);max-width:640px;text-align:left;display:flex;flex-direction:column;gap:8px}
.amb-card .focus{font-size:28px}
.amb-card .ev{border-top-color:rgba(255,255,255,.12)}
.mailto{display:flex;flex-direction:column;gap:12px}
.preview{white-space:pre-wrap;font-family:var(--ui);font-size:14px;color:var(--muted);background:rgba(255,255,255,.06);border-radius:16px;padding:12px 14px;max-height:180px;overflow:auto;margin:0}
.recip{display:flex;align-items:center;gap:6px}
.recip .chip{text-align:left}
.chip small{display:block;font-weight:400;font-size:12px;opacity:.8}

.home{transform:translate(var(--px,0px),var(--py,0px));transition:transform 3s ease}
.ambient.dark{background:#000}
.ambient.dark .time{font-size:clamp(70px,11vw,150px);color:rgba(255,255,255,.26)}
.amb-inner{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:100%;transform:translate(var(--ax,0px),var(--ay,0px));transition:transform 6s ease-in-out}
.amb-hint{animation:fadeaway 2s ease 50s forwards}
@keyframes fadeaway{to{opacity:0}}
.calfield{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.calfield input{flex:1;min-width:220px}

/* ---------- responsive ---------- */
@media (max-width:980px), (orientation:portrait){
  .home{grid-template-columns:1fr;height:auto;min-height:0;gap:22px}
  .act{grid-template-rows:auto auto}
  .now .list{overflow:visible}
  .g-tip{margin-top:22px}
}

/* ---------- family: avatars, progress pills, color swatches ---------- */
.av{width:30px;height:30px;border-radius:50%;background:var(--pb);color:var(--pi);display:inline-grid;place-items:center;font-weight:800;font-size:14px;flex:none;font-family:var(--ui);letter-spacing:0}
.av.sm{width:22px;height:22px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:8px;min-width:0}
h2.who{gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px;flex:none}
.week.mini{flex:none;height:auto;gap:2px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.week.mini .wd{padding:4px 0;gap:3px;border-radius:12px}
.week.mini .d1{font-size:12px;letter-spacing:0}
.week.mini .d2{font-size:16px}
.week.mini .mini{width:22px;height:22px}
.week.mini .mini i{width:16px;height:16px}
.week.mini .din{display:none}
.day .week.mini .wd.is-today .d2{padding:2px 7px 3px}
.t-week .wd{padding:4px;gap:3px}
.t-week .pill{padding:2px 10px 2px 2px;font-size:13px}
.t-week .pill .av{width:26px;height:26px;font-size:12px}
.t-week .week{height:auto;flex:1;min-height:0}
.pill{position:relative;display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--chip);font-size:14px;overflow:hidden}
.pill::before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p)*1%);background:var(--pb);opacity:.32}
.pill > *{position:relative}
.pill > span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.pdot{background:var(--pb)}
.bar i.pbar{background:var(--pb)}
.prs{display:flex;align-items:center;gap:12px;padding:6px 0}
.prs b{flex:1;min-width:0;font-size:17px}
.sw{display:flex;gap:6px}
.swb{width:42px;height:42px;border-radius:50%;border:3px solid transparent;background:var(--pb);cursor:pointer}
.swb[aria-pressed="true"]{border-color:var(--pi)}
.own{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.own > span{font-weight:600}
.chip.sm{min-height:46px;padding:4px 14px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.chip.sm .av{margin-left:-8px}

@media (max-width:600px){
  .cards{grid-template-columns:1fr}
  .dock button{padding:9px 12px}
  .strip{grid-template-columns:1fr}
  .prow{grid-template-columns:1fr}
}
/* ---------- the window: time and weather on the sky, one frosted pane to act on ---------- */
.glance{display:flex;flex-direction:column;min-height:0;min-width:0;text-shadow:0 1px 2px rgba(8,20,50,.35),0 0 24px rgba(8,20,50,.3)}
.g-date{font-size:20px;font-weight:500;color:var(--muted)}
.g-time{font-family:"Outfit",var(--ui);font-weight:200;font-size:clamp(92px,12vw,150px);line-height:.92;letter-spacing:-.045em;margin:6px 0 0 -6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.g-time .ap{font-size:.19em;font-weight:300;letter-spacing:0;margin-left:.2em;color:var(--muted)}
.g-focus{font-size:20px;color:var(--muted);margin-top:8px}
.g-wx{display:flex;align-items:center;gap:14px;margin-top:30px}
.g-wx svg{width:46px;height:46px;flex:none}
.g-wx .t{font-family:"Outfit",var(--ui);font-weight:300;font-size:46px;line-height:1}
.g-wx .c{font-size:16px;line-height:1.35;color:var(--muted);min-width:0}
.g-wx .c b{display:block;color:var(--ink);font-weight:600}
.g-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:18px;text-align:center;font-size:14px;color:var(--muted);background:none;border:0;padding:8px 0;border-radius:18px;cursor:pointer;width:100%}
.g-strip:active{background:rgba(255,255,255,.08)}
.g-strip .cell{display:flex;flex-direction:column;align-items:center;gap:5px}
.g-strip svg{width:24px;height:24px}
.g-strip b{color:var(--ink);font-weight:600;font-size:16px}
.g-strip .lo{font-size:13px;color:var(--faint)}
.g-strip .pp{font-size:12px;font-weight:700;color:#CDE8FF;min-height:15px}
.g-sky{display:flex;flex-direction:column;gap:6px;margin-top:18px;font-size:16px;color:var(--muted)}
.g-sky .moon{display:flex;align-items:center;gap:8px}
.g-sky .sep{display:inline-block;width:18px}
.g-sky svg{width:18px;height:18px;flex:none}
.g-tip{margin-top:16px;display:flex;gap:12px;font-size:18px;line-height:1.4;color:var(--muted)}
.g-tip svg{width:24px;height:24px;flex:none;margin-top:1px}
.g-tip b{color:var(--ink);font-weight:600}

.act{display:flex;flex-direction:column;gap:16px;min-height:0;min-width:0;padding-top:6px}
.act > .now{flex:1 1 auto}
.act > .cards{flex:none}
.pane{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.06)),rgba(20,34,80,.3);border:1px solid rgba(255,255,255,.24);border-radius:var(--r-lg);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);color:var(--ink)}
.lite .pane{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(16,24,46,.42)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.pane{background:rgba(16,24,46,.42)}}
.now{padding:24px 28px 18px;display:flex;flex-direction:column;min-height:0;min-width:0}
.nowh{display:flex;align-items:center;gap:12px;flex:none}
.nowh h1{font-family:"Outfit",var(--ui);font-weight:300;font-size:40px;letter-spacing:-.01em;line-height:1.05}
.nowh .ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.nowh .sub{font-size:16px;color:var(--muted);white-space:nowrap}
.nowh h1{white-space:nowrap}
.side{white-space:nowrap}
.nowh .prog{margin-left:auto;font-family:"Outfit",var(--ui);font-weight:300;font-size:24px;font-variant-numeric:tabular-nums}
.nbar{height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:14px 0 4px;overflow:hidden;flex:none}
.nbar i{display:block;height:100%;background:var(--done);border-radius:4px;transition:width .4s ease}
.now .pills{margin:10px 0 0}
.now .list{flex:1 1 auto;min-height:0;overflow:hidden;margin:6px -8px 0;display:flex;flex-direction:column;gap:0}
.now .ck{flex:1 1 0;min-height:54px;max-height:76px;padding:10px 8px;font-size:20px;border-bottom:1px solid rgba(255,255,255,.12);border-radius:0;align-items:center}
.now .ck:last-child{border-bottom:0}
.now .ck .box{width:30px;height:30px}
.now .ck .lbl{padding-top:0;font-weight:500}
.now .ck small{font-size:15px}
.now .ck[hidden]{display:none}
.now .alldone{padding:18px 0 8px;flex:none}
.jcs{display:flex;flex-wrap:nowrap;gap:8px;margin-top:12px;flex:none;overflow:hidden}
.jc{flex:0 1 auto;min-width:0}
.jc em{flex:none}
.jcs::-webkit-scrollbar,.dock::-webkit-scrollbar{display:none}
.jc{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex:none;border:0;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.12);font-size:15px;font-weight:600;cursor:pointer;min-height:44px;color:var(--ink)}
.jc em{font-style:normal;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.jc .d{width:8px;height:8px;border-radius:50%;flex:none}
.jc.full{opacity:.62}
.night .pane{border-color:rgba(255,255,255,.12)}
.night .alldone svg{opacity:.55}
.undo{display:flex;align-items:center;gap:14px;padding:6px 6px 6px 18px;font-size:15px;top:auto;bottom:calc(env(safe-area-inset-bottom, 0px) + 78px)}
.undo button{border:0;border-radius:999px;background:rgba(255,255,255,.22);color:inherit;font:inherit;font-weight:700;padding:0 18px;min-height:44px;cursor:pointer}
.g-seg{display:flex;gap:4px;margin-top:20px}
.g-seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:0 12px;min-height:36px;border-radius:999px;cursor:pointer}

.g-strip{margin-top:6px}
.tmr{display:flex;flex-direction:column;gap:2px;margin-top:4px}

.tmr .row:last-child{border-bottom:0}
.tmr .row span{flex:none;width:6.2em;color:var(--muted);font-size:16px}
.tmr .row b{font-weight:500}
.jc.add{color:var(--muted)}
.jc.must{box-shadow:inset 3px 0 0 var(--warn)}
.side{border:0;background:none;color:var(--muted);font:inherit;font-size:15px;font-weight:600;padding:10px 12px;border-radius:14px;cursor:pointer;min-height:48px}
.side.confirm{background:var(--warn);color:#2a0d06}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hcard{display:flex;flex-direction:column;gap:3px;text-align:left;padding:16px 22px;min-height:104px;height:104px;justify-content:center;cursor:pointer;font:inherit;min-width:0}
.hcard span{font-size:16px;color:var(--muted)}
.hcard b{font-size:20px;font-weight:600;line-height:1.25;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hcard b.empty{color:var(--muted);font-weight:500}
.hcard small{font-size:16px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet{top:calc(env(safe-area-inset-top, 0px) + 16px);bottom:calc(env(safe-area-inset-bottom, 0px) + 82px)}
.dimmer{position:fixed;inset:0;z-index:70;background:#000;opacity:.45;animation:dimin 4s ease;cursor:pointer}
@keyframes dimin{from{opacity:0}}
.wkday{padding:8px 0;border-top:1px solid var(--line)}
.wkday:first-child{border-top:0;padding-top:0}
.wkh{display:flex;align-items:baseline;gap:12px;width:100%;border:0;background:none;text-align:left;cursor:pointer;padding:4px 0 8px;font:inherit;color:inherit}
.wkh b{font-family:"Outfit",var(--ui);font-weight:300;font-size:26px}
.wkh span{color:var(--muted);font-size:14px}
.wkh em{margin-left:auto;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hday{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.hday:first-of-type{border-top:0}
select{font:inherit;color:var(--ink);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;min-height:48px;width:100%}
select option{color:#101a3a}
.dtog{display:flex;flex-wrap:wrap;gap:6px}

.g-mid{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:18px}
.g-leave,.g-timer,.g-count{display:flex;align-items:baseline;gap:12px}

.g-leave span,.g-timer span,.g-count span{font-size:17px;color:var(--muted)}
.g-count b{font-family:"Outfit",var(--ui);font-weight:300;font-size:32px;line-height:1}
.g-timer .tadd{margin-left:auto;border:0;border-radius:999px;background:rgba(255,255,255,.16);color:var(--ink);font:inherit;font-weight:700;min-width:48px;min-height:48px;cursor:pointer}

.alarm{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(200,60,40,.9);color:#fff;cursor:pointer;animation:pulse 1s ease-in-out infinite alternate}

@keyframes pulse{to{background:rgba(160,40,30,.95)}}
.tmrh{font-size:16px;color:var(--muted);margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);flex:none}

.tmr .row{padding:6px 4px;font-size:17px}

.now .list.bed{flex:0 1 auto;margin-top:4px}

.g-sky[hidden]{display:none}
input[type=time]{font:inherit;color:var(--ink);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;min-height:48px;width:100%;color-scheme:dark}

/* ---------- refinement: tighter frame, finer edges, quieter ornament ---------- */
:root{--r-lg:20px;--r-md:14px}
.home{gap:24px;padding:4px 0 0}
.act{gap:12px;padding-top:4px}
.pane{border-color:rgba(255,255,255,.16);background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04)),rgba(18,30,70,.28);-webkit-backdrop-filter:blur(30px) saturate(140%);backdrop-filter:blur(30px) saturate(140%)}
.now{padding:20px 22px 16px}
.nowh h1{font-size:36px;font-weight:300;letter-spacing:-.015em}
.nbar{height:2px;margin:12px 0 2px;background:rgba(255,255,255,.14)}
.now .list{margin:4px -6px 0}
.now .ck{padding:9px 6px;min-height:52px;font-size:19px;border-bottom-color:rgba(255,255,255,.09)}
.now .ck .lbl{font-weight:400}
.ck .box,.now .ck .box{width:24px;height:24px;border-width:1.5px;border-color:rgba(255,255,255,.55)}
.ck .box svg{width:14px;height:14px}
.cards{gap:12px}
.hcard{padding:14px 18px;min-height:100px;height:100px;gap:2px}
.hcard span,.hcard small{line-height:1.3}
.hcard b{line-height:1.3}
.ambient .time{font-family:"Outfit",var(--ui);font-weight:200;letter-spacing:-.04em}
.ambient .time .ap{font-weight:300}
.ambient .date{font-weight:400}
.amb-card{border-radius:var(--r-lg)}
.amb-card .eyebrow{text-transform:none;letter-spacing:0;font-size:15px;font-weight:500}
.amb-card .focus{font-family:"Outfit",var(--ui);font-weight:300;font-size:30px}
.amb-card .ev .tm{font-weight:500}
.amb-card .ev .tt{font-weight:500}

<div class="sky" id="sky" aria-hidden="true"><div class="stars" id="stars"></div><div class="horizon"></div><div class="sunglow"></div></div>

<script>
(function(){
/* ================= household content (from the weekly checklist) ================= */
/* ================= household profile =================
   Everything specific to one home (location, weekly schedule, checklists) lives in a profile saved on the
   device (Settings › Household), never in this file. The defaults below are a neutral starting point. */
const DN=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const GENERIC={v:1,loc:null,sched:{trash:1,cleaner:-1,clothes:-1,prep1:[6],prep2:[2],leave:'',school:[0,1,2,3,4]},names:{cleaner:'Cleaner',helper:'Helper'},
  days:[{focus:'Plan the week',tasks:'Plan dinners for the week\nMake the grocery list'},{focus:'Trash day',tasks:'Bring the bins back in'},{focus:'Midweek reset',tasks:'Quick tidy of shared spaces'},
    {focus:'Catch up',tasks:'Put away clean laundry'},{focus:'Close the week',tasks:'Use up perishables for dinner\nNote what ran out'},{focus:'Family day',tasks:''},{focus:'Get ready for Monday',tasks:'Glance at the week ahead'}],
  routine:{m:'Everyone dressed\nDishwasher emptied\nBreakfast dishes cleared\nLunches packed\nCounters wiped',d:'Dinner decided | Anything to defrost?\nOne load of laundry started or put away',e:'Dinner made, leftovers put away\nKitchen cleaned | Counters, stove, sink, dishwasher run\n10-minute tidy\nThings for tomorrow by the door\nTrash check'},
  sideways:'Everyone fed\nKitchen sink empty',garbage:'Collect trash from every room\nRecycling broken down\nFridge clean-out | Toss expired food\nBins to the curb',
  cleanerPrep:'Surfaces and floors clear enough to clean',cleanerNote:'',clothes:'Try-on check | Anything too small?\nOutgrown items set aside',clothesNote:'',
  prep:'Wash and chop fruit and veg\nCook one protein and one grain in bulk\nPortion lunches into containers',laundry:'Wash, dry, put away the same day',helper:'Laundry folded and put away\nLight cleaning reset',rules:'Fridge | leftovers eaten or tossed within 3–4 days',leaveLabel:'Leave for school',events:''};
const okProfile=x=>x&&x.v===1&&Array.isArray(x.days)&&x.days.length===7&&x.sched&&x.routine;
function loadProfile(){try{const x=JSON.parse(lsGet('hub-profile','null'));if(okProfile(x))return merge(clone(GENERIC),x)}catch(e){}return clone(GENERIC)}
// one line per item, "Task | note"; ids follow position so saved checkmarks keep matching
const lines=(t,pre)=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean).map((x,i)=>{const k=x.indexOf('|');return k<0?[pre+(i+1),x]:[pre+(i+1),x.slice(0,k).trim(),x.slice(k+1).trim()].filter((v,n)=>n<2||v)});
let P,DAYS,ROUTINE,SIDEWAYS,ANCHORS,PREP,LAUNDRY,MGR,LOC,CURB;
function applyProfile(x){P=x;const sc=P.sched,prev=d=>(d+6)%7;LOC=P.loc;
  DAYS=DN.map((name,i)=>({k:name.slice(0,3).toLowerCase(),name,focus:P.days[i].focus||'',tag:i===sc.trash?'bins':i===sc.cleaner?'clean':i===sc.clothes?'clothes':undefined,tasks:lines(P.days[i].tasks,'t')}));
  ROUTINE=[{k:'m',title:'Morning',sub:'Before you leave',items:lines(P.routine.m,'m')},{k:'d',title:'Midday check',sub:'Two minutes',items:lines(P.routine.d,'d')},{k:'e',title:'Evening',sub:'Close the day',items:lines(P.routine.e,'e')}];
  SIDEWAYS=lines(P.sideways,'s');PREP=lines(P.prep,'p');LAUNDRY=lines(P.laundry,'l');MGR=lines(P.helper,'h');
  ANCHORS=[{k:'garbage',cat:'bins',days:[prev(sc.trash),sc.trash],title:'Trash night',when:[DN[prev(sc.trash)]+' night',DN[sc.trash]],items:lines(P.garbage,'g')}];
  if(sc.cleaner>=0)ANCHORS.push({k:'cleaner',cat:'clean',days:[prev(sc.cleaner),sc.cleaner],title:P.names.cleaner+' prep',when:[DN[prev(sc.cleaner)]+' night',DN[sc.cleaner]],note:P.cleanerNote,items:lines(P.cleanerPrep,'c')});
  if(sc.clothes>=0)ANCHORS.push({k:'clothes',cat:'clothes',days:[sc.clothes],title:'Kids’ clothing check',when:['This week'],note:P.clothesNote,items:lines(P.clothes,'k')});
  const g=ANCHORS[0].items,ci=g.findIndex(x=>/curb/i.test(x[1]));CURB=g.length?g[ci<0?g.length-1:ci][0]:'';}
const LISTS=[{k:'buy',title:'Running out / need to buy',ph:'e.g. paper towels, sandwich bags'},{k:'outgrown',title:'Outgrown + sizes needed',ph:'e.g. 3T pants, size 9 rain boots'},{k:'forManager',title:'Notes for the house manager',ph:'e.g. pharmacy pickup Thursday'}];
const CATC={bins:'var(--bins)',clean:'var(--clean)',hm:'var(--hm)',prep:'var(--prep)',clothes:'var(--clothes)',cal:'var(--ink)',hol:'var(--faint)',day:'var(--ink)',laundry:'#BFE1FF'};
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#0E2A1C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ================= helpers ================= */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const parseLocal=s=>{const p=String(s).split('T'),a=p[0].split('-').map(Number),b=(p[1]||'0:0').split(':').map(Number);return new Date(a[0],a[1]-1,a[2],b[0]||0,b[1]||0)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dowOf=s=>(parse(s).getDay()+6)%7;
const mondayOf=s=>addDays(s,-dowOf(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function merge(a,b){for(const k in b){if(isObj(b[k])&&isObj(a[k]))merge(a[k],b[k]);else a[k]=clone(b[k]);}return a}
const nest=(key,val)=>key.split('.').reduceRight((acc,k)=>({[k]:acc}),val);
const dig=(o,key)=>key.split('.').reduce((a,k)=>a==null?undefined:a[k],o);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ancWeek=(a,d)=>a.days.length>1&&a.days[1]<a.days[0]&&dowOf(d)===a.days[0]?mondayOf(addDays(d,1)):mondayOf(d);
function prepKey(date){const w=dowOf(date),sc=P.sched,wk=w===6?mondayOf(addDays(date,1)):mondayOf(date);if(sc.prep1.includes(w))return wk+'-s1';if(sc.prep2.includes(w))return wk+'-s2';return null}
const cnt=(items,map)=>items.filter(i=>map&&map[i[0]]).length;
const fmtTime=ms=>new Date(ms).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}).replace(':00','').toLowerCase();
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
// a profile can arrive in the address fragment (#profile=…), which browsers never send to the server
(function(){const k=/^#key=([A-Za-z0-9_-]{43})$/.exec(location.hash);if(k){lsSet('hub-pkey',k[1]);history.replaceState(null,'',location.pathname+location.search);return}
  const m=/^#profile=([A-Za-z0-9_-]+)$/.exec(location.hash);if(!m)return;
  try{const b=m[1].replace(/-/g,'+').replace(/_/g,'/'),x=JSON.parse(decodeURIComponent(escape(atob(b))));if(okProfile(x)){lsSet('hub-profile',JSON.stringify(x));lsSet('hub-wx','')}}catch(e){}
  history.replaceState(null,'',location.pathname+location.search)})();
applyProfile(loadProfile());

/* ================= store: claude.ai shared db, or this device ================= */
function makeLocal(){
  const KEY='home-hub-v1';let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
  const subs=new Set();const save=()=>lsSet(KEY,JSON.stringify(data));const emit=()=>subs.forEach(f=>f());
  const snap=p=>({id:p.split('/').pop(),exists:p in data,data:()=>clone(data[p])});
  const doc=p=>({get:async()=>snap(p),set:async d=>{data[p]=clone(d);save();emit()},
    update:async d=>{if(!(p in data))throw{code:'invalid_argument'};merge(data[p],d);save();emit()},
    onSnapshot(fn){const f=()=>fn(snap(p));subs.add(f);setTimeout(f);return()=>subs.delete(f)}});
  const query=(c,fl)=>({where:(f,op,v)=>query(c,fl.concat([[f,v]])),onSnapshot(fn){const n=c.split('/').length+1;
    const f=()=>fn({docs:Object.keys(data).filter(p=>p.startsWith(c+'/')&&p.split('/').length===n&&fl.every(x=>data[p][x[0]]===x[1])).sort().map(snap)});
    subs.add(f);setTimeout(f);return()=>subs.delete(f)}});
  return {doc,collection:c=>query(c,[])};
}
let store=null,shared=false;
const C={},Q={},T=new Set();
const S={today:iso(new Date()),sel:iso(new Date()),sheet:null,err:null,ready:false,wake:null,lite:lsGet('hub-lite','0')==='1',skyMode:lsGet('hub-sky','live'),q:null,addDest:'buy',group:null,amb:false,ambOn:lsGet('hub-amb','1')==='1',darkOn:lsGet('hub-dark','1')==='1',timers:(()=>{try{return JSON.parse(lsGet('hub-timers','[]')).filter(t=>t&&t.end>Date.now()-120000)}catch(e){return []}})(),ring:null,dimOn:lsGet('hub-dim','1')==='1',dim:false,shiftI:0,mail:null,flash:null};
let lastAct=Date.now(),swallow=false;
// after a reload in the night, go straight back to the night clock instead of lighting the screen
if(S.ambOn&&(new Date().getHours()>=21||new Date().getHours()<5)&&!S.timers.length){S.amb=true;lastAct=Date.now()-180000}
function errText(e){const c=e&&e.code;
  if(c==='quota_exceeded')return 'Storage is full. Clear some finished list items.';
  if(c==='revoked'||c==='not_granted')return 'Can’t save right now. Reload to try again.';
  if(c==='invalid_argument')return 'View-only access, so changes aren’t saved.';
  return 'Couldn’t save just now. Tap again in a moment.'}
function patch(path,p,base){
  C[path]=merge(clone(C[path]||base||{}),p);T.add(path);render();
  Q[path]=(Q[path]||Promise.resolve()).then(()=>commit(path,p,base)).catch(()=>{}).then(()=>T.delete(path))}
async function commit(path,p,base,retry){
  if(!store)return;const ref=store.doc(path);
  try{const s=await ref.get();if(s.exists)await ref.update(p);else await ref.set(merge(clone(base||{}),p));if(S.err){S.err=null;render()}}
  catch(e){if(e&&e.code==='unavailable'&&!retry){await new Promise(r=>setTimeout(r,600+Math.random()*900));return commit(path,p,base,true)}S.err=errText(e);render()}}
const onErr=e=>{S.err=errText(e);render()};
const weekSubs=new Map();
function ensureWeek(mon){if(!store||weekSubs.has(mon))return;
  const u1=store.collection('days').where('week','==',mon).onSnapshot(s=>{s.docs.forEach(d=>{if(!T.has('days/'+d.id))C['days/'+d.id]=clone(d.data())});render()},onErr);
  const u2=store.doc('weeks/'+mon).onSnapshot(s=>{if(s.exists&&!T.has('weeks/'+mon))C['weeks/'+mon]=clone(s.data());render()},onErr);
  weekSubs.set(mon,[u1,u2])}
function syncSubs(){const keep=new Set([mondayOf(S.today),mondayOf(addDays(S.today,1)),mondayOf(addDays(S.today,2)),mondayOf(S.sel)]);
  keep.forEach(ensureWeek);for(const [m,us] of weekSubs){if(!keep.has(m)){us.forEach(f=>f());weekSubs.delete(m)}}}
const dayData=d=>C['days/'+d]||{};
const weekData=m=>C['weeks/'+m]||{};
const listsData=()=>C['lists/house']||{};
const dayBase=d=>({date:d,week:mondayOf(d),done:{}});
const weekBase=m=>({week:m,visits:[],plan:{},anchors:{},visitLog:{}});
function dayStats(d){const D=DAYS[dowOf(d)],done=dayData(d).done||{};const ids=ROUTINE.flatMap(r=>r.items.map(i=>i[0])).concat(D.tasks.map(t=>t[0]));
  const n=ids.filter(i=>done[i]).length;return{n,total:ids.length,pct:Math.round(100*n/ids.length)}}

/* ================= weather (Open-Meteo, works when self-hosted) ================= */
const INART=!!(window.claude&&window.claude.use);
// without a saved location the sky follows the center of the US until a ZIP is set
const skyLoc=()=>LOC||{lat:39.8,lon:-98.6};
const wxUrl=()=>'https://api.open-meteo.com/v1/forecast?latitude='+LOC.lat+'&longitude='+LOC.lon+
  '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day'+
  '&hourly=temperature_2m,precipitation_probability,weather_code'+
  '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset'+
  '&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=6';
let WX=null,WXstate='loading';
try{const c=JSON.parse(lsGet('hub-wx','null'));if(c&&c.current&&c.daily)WX=c}catch(e){}
function WMO(c){
  if(c===0)return['Clear','sun'];if(c===1)return['Mostly clear','sun'];if(c===2)return['Partly cloudy','partly'];if(c===3)return['Cloudy','cloud'];
  if(c===45||c===48)return['Fog','fog'];if(c>=51&&c<=57)return['Drizzle','rain'];
  if(c>=61&&c<=67)return[c>=66?'Freezing rain':(c===65?'Heavy rain':'Rain'),'rain'];
  if(c>=71&&c<=77)return['Snow','snow'];if(c>=80&&c<=82)return['Showers','rain'];if(c===85||c===86)return['Snow showers','snow'];
  if(c>=95)return['Thunderstorms','storm'];return['Cloudy','cloud']}
const CLOUD='<path d="M7.5 19h9.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 10.2 4.4 4.4 0 0 0 7.5 19z" fill="rgba(255,255,255,.92)" stroke="rgba(255,255,255,1)" stroke-width="1" stroke-linejoin="round"/>';
const SUNG='<circle cx="12" cy="12" r="4.4" fill="#FFD25A"/><g stroke="#FFD25A" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g>';
const MOONG='<path d="M15.5 3.5a8.5 8.5 0 1 0 5 13.6A7 7 0 0 1 15.5 3.5z" fill="#E8ECFF"/>';
function icon(kind,isDay){const lit=isDay===false?MOONG:SUNG;let s;
  if(kind==='sun')s=lit;
  else if(kind==='partly')s='<g transform="translate(-2 -3) scale(.75)">'+lit+'</g>'+CLOUD;
  else if(kind==='fog')s='<g stroke="rgba(255,255,255,.9)" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></g>';
  else if(kind==='rain')s='<g transform="translate(0 -3)">'+CLOUD+'</g><g stroke="#8FD0FF" stroke-width="1.9" stroke-linecap="round"><path d="M9 18.5l-1 2.5M13 18.5l-1 2.5M17 18.5l-1 2.5"/></g>';
  else if(kind==='snow')s='<g transform="translate(0 -3)">'+CLOUD+'</g><g fill="#DDF1FF"><circle cx="8.5" cy="20" r="1.2"/><circle cx="12.5" cy="21.2" r="1.2"/><circle cx="16.5" cy="20" r="1.2"/></g>';
  else if(kind==='storm')s='<g transform="translate(0 -3)">'+CLOUD+'</g><path d="M12.5 15.5l-2.5 4h3l-1.5 3.5" fill="none" stroke="#FFD25A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>';
  else s=CLOUD;
  return '<svg viewBox="0 0 24 24" aria-hidden="true">'+s+'</svg>'}
const rnd=v=>v==null||isNaN(v)?'–':Math.round(v);
const todayIdx=()=>WX&&WX.daily?WX.daily.time.indexOf(S.today):-1;
function dressHint(ofs){const t0=todayIdx(),i=t0<0?-1:t0+(ofs||0);if(t0<0||i>=WX.daily.time.length)return '';const d=WX.daily;
  const hi=d.temperature_2m_max[i],lo=d.temperature_2m_min[i],pr=d.precipitation_probability_max[i]||0,kind=WMO(d.weather_code[i])[1];
  let h=hi<=35?'Winter coat, hat and mittens':hi<=50?'Warm jacket':hi<=62?'Light jacket or sweater':hi<=75?'Long sleeves are fine':'Short-sleeve weather';
  if(lo<45&&hi>62)h+=', plus a layer for the morning';
  const extra=kind==='snow'?'snow boots':(pr>=50||kind==='rain'||kind==='storm')?'rain boots and an umbrella':'';
  return h+(extra?' · '+extra:'')}
function applyFeed(v){S.err=null;lsSet('hub-feed',v);FEED=v;CAL.events=[];CAL.state=v?'loading':'embed';render();loadFeed()}
const loadScript=src=>new Promise((ok,no)=>{const x=document.createElement('script');x.src=src;x.onload=ok;x.onerror=no;document.head.appendChild(x)});
let scanStream=null,scanT=0;
async function openScan(){let box=document.getElementById('scanbox');if(!box){box=document.createElement('div');box.id='scanbox';document.body.appendChild(box)}
  box.innerHTML='<div class="scrim" data-act="scanclose"></div><div class="sheet glass small scan" role="dialog" aria-modal="true" aria-label="Scan the calendar link"><header class="sheethead"><h2>Scan the calendar link<small>Hold the QR code a hand’s width from the camera</small></h2><button class="iconbtn" data-act="scanclose" aria-label="Close">×</button></header><div class="sheetbody"><video id="scanv" playsinline muted></video><p class="note" id="scanmsg">Starting the camera…</p></div></div>';
  box.hidden=false;const say=m=>{const n=document.getElementById('scanmsg');if(n)n.textContent=m};
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false})}
  catch(e){say('The camera is turned off for this app. Hold the Back button, choose Unlock, then Settings › Device › Allow Camera, and try again.');return}
  const v=document.getElementById('scanv');if(!v){closeScan();return}v.srcObject=scanStream;try{await v.play()}catch(e){}
  let detect=null;
  if('BarcodeDetector' in window){try{const bd=new BarcodeDetector({formats:['qr_code']});detect=async()=>{const r=await bd.detect(v);return r[0]&&r[0].rawValue}}catch(e){}}
  if(!detect){try{await loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js')}catch(e){say('Couldn’t load the QR reader. Check the Wi-Fi and try again.');return}
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    detect=async()=>{if(!v.videoWidth)return null;const w=Math.min(640,v.videoWidth),h=Math.round(w*v.videoHeight/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const r=window.jsQR(cx.getImageData(0,0,w,h).data,w,h);return r&&r.data}}
  say('Point the camera at the QR code.');
  const loop=async()=>{if(!scanStream)return;let val=null;try{val=await detect()}catch(e){}
    val=val&&String(val).trim();
    if(val&&/^https:\/\//.test(val)){closeScan();applyFeed(val);S.err=null;S.flash='feed';return}
    if(val)say('That code isn’t a calendar link. Make the code on the qr.html page.');
    scanT=setTimeout(loop,300)};
  loop()}
function closeScan(){clearTimeout(scanT);if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}const b=document.getElementById('scanbox');if(b){b.hidden=true;b.innerHTML=''}}
const BATT={on:false,level:1};
function watchBattery(){if(!navigator.getBattery)return;navigator.getBattery().then(b=>{const upd=()=>{const was=BATT.on;BATT.on=!b.charging;BATT.level=b.level;if(was!==BATT.on||BATT.on)render()};
  ['chargingchange','levelchange'].forEach(ev=>b.addEventListener(ev,upd));upd()}).catch(()=>{})}
function battNote(){if(!BATT.on)return '';const pc=Math.round(BATT.level*100);
  return '<div class="status glass batt'+(pc<=20?' low':'')+'" role="status">Unplugged · battery '+pc+'%'+(pc<=20?' · plug the tablet back in':'')+'</div>'}
async function loadWx(){if(!LOC){WXstate='noloc';return}
  try{const r=await fetch(wxUrl(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(!j.current||!j.daily)throw new Error('bad data');
    j.fetchedAt=Date.now();WX=j;WXstate='ok';lsSet('hub-wx',JSON.stringify(j))}
  catch(e){WXstate=WX?'offline':(INART?'blocked':'offline')}
  paintSky();render()}

/* ================= calendar: connector inside claude.ai, Google embed when self-hosted ================= */
const ART_CALS=[];
function loadCals(){if(INART)return ART_CALS;return lsGet('hub-cals','').split(/[\s,]+/).filter(Boolean).map(x=>({id:x,name:x,holiday:/holiday/.test(x)}))}
let CAL_IDS=loadCals();
let FEED=INART?'':lsGet('hub-feed','');
function feedNorm(list){const out=[];(Array.isArray(list)?list:[]).forEach(e=>{if(!e||!e.start)return;const title=e.title||'(No title)',cat=e.cal==='hol'?'hol':'cal',loc=e.location||'';
  if(e.allDay){let d=String(e.start).slice(0,10);const end=e.end?String(e.end).slice(0,10):addDays(d,1);let n=0;while(d<end&&n<14){out.push({title,allDay:true,day:d,startMs:0,location:loc,cat});d=addDays(d,1);n++}}
  else{const st=new Date(e.start),en=e.end?new Date(e.end):null;if(isNaN(st))return;out.push({title,allDay:false,day:iso(st),startMs:st.getTime(),endMs:en&&!isNaN(en)?en.getTime():null,location:loc,cat})}});return out}
async function loadFeed(){if(!FEED)return;
  try{const r=await fetch(FEED+(FEED.includes('?')?'&':'?')+'days=8',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
    if(j.error){CAL.state='feedbad';CAL.err=j.error}else{CAL.events=feedNorm(j.events);CAL.state='ok';CAL.err=null;lsSet('hub-feed-cache',JSON.stringify(j))}}
  catch(e){const c=(()=>{try{return JSON.parse(lsGet('hub-feed-cache','null'))}catch(_){return null}})();
    if(c&&c.events&&CAL.state!=='ok'){CAL.events=feedNorm(c.events);CAL.state='ok'}CAL.err='offline';if(CAL.state==='loading')CAL.state='error'}
  render()}
const CAL={state:INART||lsGet('hub-feed','')?'loading':'embed',events:[],err:null};
let MCP=null,calUn=[];const calRes={};
const DENY=['needs_reauth','server_not_connected','selection_required','blocked_by_policy','approval_required','not_in_manifest','consent_required'];
const calInput=id=>({calendarId:id,startTime:S.today+'T00:00:00',endTime:addDays(S.today,7)+'T00:00:00',orderBy:'startTime',pageSize:100});
function normEvents(list,cal){const out=[];(Array.isArray(list)?list:[]).forEach(e=>{if(!e||e.status==='cancelled'||!e.start)return;const title=e.summary||'(No title)',loc=e.location||'';
  if(e.start.dateTime){const s=new Date(e.start.dateTime),en=e.end&&e.end.dateTime?new Date(e.end.dateTime):null;if(isNaN(s))return;out.push({title,allDay:false,day:iso(s),startMs:s.getTime(),endMs:en?en.getTime():null,location:loc,cat:cal.holiday?'hol':'cal'})}
  else if(e.start.date){let d=String(e.start.date).slice(0,10);const end=e.end&&e.end.date?String(e.end.date).slice(0,10):addDays(d,1);let n=0;while(d<end&&n<14){out.push({title,allDay:true,day:d,startMs:0,location:loc,cat:cal.holiday?'hol':'cal'});d=addDays(d,1);n++}}});return out}
function applyCal(id,payload){calRes[id]=normEvents(payload&&payload.events,CAL_IDS.find(c=>c.id===id)||{});CAL.events=[].concat(...Object.values(calRes));CAL.state='ok';CAL.err=null}
function onCalErr(id,err){const c=(err&&err.code)||'upstream_error';if(id!==CAL_IDS[0].id&&CAL.state==='ok')return;
  if(DENY.includes(c)){Object.keys(calRes).forEach(k=>delete calRes[k]);CAL.events=[];CAL.state=c}else{CAL.err=c;if(CAL.state==='loading')CAL.state='error'}}
function watchCals(){calUn.forEach(u=>{try{u()}catch(e){}});calUn=[];
  CAL_IDS.forEach(c=>{try{calUn.push(MCP.watchTool('Google Calendar','list_events',calInput(c.id),ev=>{
    if(ev.type==='data')applyCal(c.id,ev.result.payload);else onCalErr(c.id,ev.error);render()},{refetchInterval:15*60*1000}))}catch(e){CAL.state='error';render()}})}
let allowing=false;
async function calAllow(){if(!MCP||allowing)return;allowing=true;CAL.state='loading';render();
  for(const c of CAL_IDS){try{const r=await MCP.callTool('Google Calendar','list_events',calInput(c.id));applyCal(c.id,r.payload)}catch(e){onCalErr(c.id,e)}}
  allowing=false;render()}
async function startCalendar(){if(!INART)return;try{MCP=await window.claude.use('mcp')}catch(e){MCP=null}
  if(!MCP){CAL.state='nomcp';render();return}watchCals()}
const embedUrl=()=>'https://calendar.google.com/calendar/embed?ctz=America%2FChicago&mode=AGENDA&wkst=1&showTitle=0&showPrint=0&showTabs=1&showCalendars=0&showTz=0&'+
  CAL_IDS.map((c,i)=>'src='+encodeURIComponent(c.id)+'&color='+encodeURIComponent(['#7986CB','#F6BF26','#33B679','#E67C73'][i%4])).join('&');

  feedbad:'The calendar feed refused the request. Check the link in Settings, including the key at the end.',needs_reauth:'Reconnect Google Calendar in claude.ai Settings → Connectors.',server_not_connected:'Add Google Calendar in claude.ai Settings → Connectors.',

/* ================= time of day ================= */
function solar(date,lat,lon){const r=Math.PI/180,n=date.getTime()/86400000+2440587.5-2451545.0;
  const L=((280.46+0.9856474*n)%360+360)%360,g=((357.528+0.9856003*n)%360+360)%360;
  const lam=L+1.915*Math.sin(g*r)+0.020*Math.sin(2*g*r),eps=23.439-0.0000004*n;
  const dec=Math.asin(Math.sin(eps*r)*Math.sin(lam*r)),ra=Math.atan2(Math.cos(eps*r)*Math.sin(lam*r),Math.cos(lam*r))/r;
  const gmst=((280.46061837+360.98564736629*n)%360+360)%360,ha=((gmst+lon-ra)%360+540)%360-180;
  const el=Math.asin(Math.sin(lat*r)*Math.sin(dec)+Math.cos(lat*r)*Math.cos(dec)*Math.cos(ha*r))/r;
  const az=(Math.atan2(Math.sin(ha*r),Math.cos(ha*r)*Math.sin(lat*r)-Math.tan(dec)*Math.cos(lat*r))/r+540)%360;
  return{el,az,rising:ha<0}}
let sunCache={day:null};
function sunTimes(){
  const i=todayIdx();if(i>=0&&WX.daily.sunrise)return{rise:parseLocal(WX.daily.sunrise[i]).getTime(),set:parseLocal(WX.daily.sunset[i]).getTime()};
  if(sunCache.day===S.today)return sunCache;
  const d0=parse(S.today).getTime();let prev=null,rise=null,set=null;
  for(let m=0;m<=1440;m+=2){const t=d0+m*60000,e=solar(new Date(t),skyLoc().lat,skyLoc().lon).el;if(prev!==null){if(prev<-0.833&&e>=-0.833)rise=t;if(prev>=-0.833&&e<-0.833)set=t}prev=e}
  sunCache={day:S.today,rise,set};return sunCache}
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixc=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgba=(c,a)=>'rgba('+c.join(',')+','+a+')';
const NIGHT=['#05070f','#0c1330','#18214c'],NOON=['#2564c8','#4a95e4','#93c8f2'],DUSK=['#2d3f8a','#9a4f86','#d9844e'];
/* keyframes by sun elevation (degrees); morning and evening are tinted differently, like the real sky */
const SKY_RISE=[[-18,NIGHT],[-12,['#0b1230','#1c2456','#2e3266']],[-6,['#232c60','#5a4a90','#a86a86']],[0,['#33468e','#9a7cb8','#f0a88a']],[8,['#3a62b8','#8aa2d6','#f2c6a0']],[18,['#2b62c4','#5a9ae2','#a8d0f2']],[34,NOON]];
const SKY_SET=[[-18,NIGHT],[-12,['#0a1030','#1a2050','#2c2a5c']],[-6,['#1a1f4a','#4a2f6e','#8a4a78']],[0,['#2a3270','#86468a','#e0784c']],[8,DUSK],[16,['#2a55b0','#6c86c4','#e2a87c']],[24,['#2560c0','#4a8fdc','#9cc4ea']],[34,NOON]];
function skyAt(el,rising){const st=rising?SKY_RISE:SKY_SET;if(el<=st[0][0])return st[0][1].map(hex);
  for(let i=1;i<st.length;i++)if(el<=st[i][0]){const t=(el-st[i-1][0])/(st[i][0]-st[i-1][0]);return st[i-1][1].map((h,k)=>mixc(hex(h),hex(st[i][1][k]),t))}
  return st[st.length-1][1].map(hex)}
function phaseLabel(t){const h=t.getHours();return h<5?'Night':h<12?'Morning':h<17?'Afternoon':h<21?'Evening':'Night'}
const fmtDur=k=>k<60?k+' min':Math.floor(k/60)+' hr'+(k%60?' '+(k%60)+' min':'');
function sunLabel(t){const s=sunTimes(),now=t.getTime();if(!s.rise||!s.set)return phaseLabel(t);const m=x=>Math.max(1,Math.round((x-now)/60000));
  if(now<s.rise)return m(s.rise)<=90?'Sunrise in '+fmtDur(m(s.rise)):'Night · sunrise at '+fmtTime(s.rise);
  if(now<s.rise+3600000)return 'Sunrise · golden hour';
  if(now<s.set-3600000)return phaseLabel(t);
  if(now<s.set)return 'Golden hour · sunset in '+fmtDur(m(s.set));
  if(now<s.set+40*60000)return 'Twilight';
  return t.getHours()>=21?'Night':'Evening · sun set at '+fmtTime(s.set)}
// After 7:30 pm dinner has happened either way, so meals, the clothing tip and the day's theme look at tomorrow.
const DINNER_DONE=19.5;
function lookAhead(t){t=t||new Date();return t.getHours()+t.getMinutes()/60>=DINNER_DONE}
function routineIdx(t){const h=t.getHours()+t.getMinutes()/60;return h<11?0:h<16?1:2}
let lastSky='';
function skyNow(){if(S.previewMin==null)return new Date();const d=parse(S.today);d.setMinutes(S.previewMin);return d}
function paintSky(){const t=skyNow(),sun=S.skyMode==='dusk'&&S.previewMin==null?{el:12,az:245,rising:false}:solar(t,skyLoc().lat,skyLoc().lon),c=skyAt(sun.el,sun.rising),light=c.map(x=>mixc(x,[255,255,255],.28));
  const el=sun.el,cl=(x,a,b)=>Math.max(a,Math.min(b,x));
  const sx=cl((sun.az-80)/200*100,-10,110),sy=cl(88-el/38*78,8,112);
  const sc=el>=20?[255,248,228]:el>=0?mixc([255,178,104],[255,248,228],el/20):[255,132,92];
  const ga=el>=-1?cl(.62-Math.max(0,el-25)/60,.35,.62):cl(.62*(1+(el+1)/7),0,.62);
  const hzA=cl(1-Math.abs(el-1)/10,0,1)*.55,hzc=sun.rising?[255,170,140]:[255,140,90];
  const starA=cl((-5-el)/9,0,.9);
  let B=[rgba(light[2],.5),rgba(light[1],.4),rgba(light[2],.42)];
  if(!sun.rising&&el>-8&&el<20){const w=el>=2&&el<=10?1:el<2?cl((el+8)/10,0,1):cl((20-el)/10,0,1);
    const d1=mixc(light[2],[255,170,110],w),d2=mixc(light[1],[200,110,200],w),d3=mixc(light[2],[255,140,90],w);B=[rgba(d1,.5),rgba(d2,(.4+.05*w).toFixed(2)),rgba(d3,(.42+.03*w).toFixed(2))]}
  const v='--s1:'+rgba(c[0],1)+';--s2:'+rgba(c[1],1)+';--s3:'+rgba(c[2],1)+';--b1:'+B[0]+';--b2:'+B[1]+';--b3:'+B[2]+
    ';--sx:'+sx.toFixed(1)+'%;--sy:'+sy.toFixed(1)+'%;--sc0:'+rgba(sc,ga.toFixed(2))+';--sc1:'+rgba(sc,(ga*.45).toFixed(2))+';--sc2:'+rgba(sc,(ga*.14).toFixed(2))+
    ';--hz:'+rgba(hzc,hzA.toFixed(2))+';--starA:'+starA.toFixed(2);
  const lum=(.2126*c[2][0]+.7152*c[2][1]+.0722*c[2][2])/255,ga2=(.32+Math.max(0,lum-.45)*.55).toFixed(2);
  document.documentElement.style.setProperty('--glass','rgba(12,18,36,'+ga2+')');
  if(v!==lastSky){document.getElementById('sky').setAttribute('style',v);lastSky=v;const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute('content',rgba(c[0],1))}
  const veil=document.getElementById('veil');let vc='veil';
  if(WX&&WX.current){const k=WMO(WX.current.weather_code)[1];if(k==='rain'||k==='storm'||k==='snow')vc+=' wet';else if(k==='cloud'||k==='fog')vc+=' cloudy'}
  if(veil.className!==vc)veil.className=vc;
  document.documentElement.classList.toggle('lite',S.lite);document.documentElement.classList.toggle('night',el<-6);
}

/* ================= tiles ================= */
const ck=(on,act,attrs,label,sub)=>'<button class="ck'+(on?' on':'')+'" role="checkbox" aria-checked="'+(!!on)+'" data-act="'+act+'" '+attrs+'><span class="box" aria-hidden="true">'+CHECK+'</span><span class="lbl">'+esc(label)+(sub?'<small>'+esc(sub)+'</small>':'')+'</span></button>';
const ring=(n,of)=>'<div class="ring" style="--p:'+(of?Math.round(100*n/of):0)+'" aria-label="'+n+' of '+of+' done"><span>'+n+'/'+of+'</span></div>';
const dotc=c=>'<span class="dot" style="--c:'+(CATC[c]||'#fff')+'"></span>';

function clockHTML(){const t=new Date();let h=t.getHours();const ap=h>=12?'pm':'am';h=h%12||12;return h+':'+pad(t.getMinutes())+'<span class="ap">'+ap+'</span>'}
// moon phase from the mean synodic month, counted from the new moon of 6 Jan 2000 18:14 UTC
function moonInfo(){const P=29.530588853,age=(((Date.now()-Date.UTC(2000,0,6,18,14))/864e5)%P+P)%P,f=age/P;
  const name=age<1.85?'New moon':age<5.54?'Waxing crescent':age<9.23?'First quarter':age<12.92?'Waxing gibbous':age<16.61?'Full moon':age<20.3?'Waning gibbous':age<23.99?'Last quarter':age<27.68?'Waning crescent':'New moon';
  const k=Math.cos(2*Math.PI*f),rx=(8*Math.abs(k)).toFixed(2),wax=f<.5;
  const d=wax?'M10 2A8 8 0 0 1 10 18A'+rx+' 8 0 0 '+(k>0?0:1)+' 10 2Z':'M10 2A8 8 0 0 0 10 18A'+rx+' 8 0 0 '+(k>0?1:0)+' 10 2Z';
  const days=Math.round(wax?(14.77-age):(P-age)),next=(wax?'full':'new')+' moon '+(days<=0?'today':'in '+days+(days===1?' day':' days'));
  return {svg:'<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="rgba(255,255,255,.18)"/><path d="'+d+'" fill="#F1F3FF"/></svg>',text:name+', '+next}}
function sunBlock(){const s=sunTimes(),m=moonInfo();
  return (s.rise&&s.set?'<div>Sunrise '+fmtTime(s.rise)+'<span class="sep" aria-hidden="true"></span>Sunset '+fmtTime(s.set)+'</div>':'')+'<div class="moon">'+m.svg+m.text+'</div>'}
const SHIRT='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M8 3l4 2 4-2 5 4-3 3-2-1v12H8V9l-2 1-3-3z"/></svg>';
const seg=v=>'<div class="g-seg" role="group" aria-label="Forecast"><button data-act="wxview" data-v="hours" aria-pressed="'+(v==='hours')+'">Hours</button><button data-act="wxview" data-v="days" aria-pressed="'+(v==='days')+'">5 days</button></div>';
function wxGlance(){
  if(!WX)return '<div class="g-wx"><div class="c"><b>'+(WXstate==='noloc'?'Add your ZIP in Settings › Household':WXstate==='loading'?'Loading the weather…':WXstate==='offline'?'Can’t reach the weather service':'Weather shows on the tablet')+'</b>'+(WXstate==='offline'?'Trying again soon.':'')+'</div></div>';
  const c=WX.current,l=WMO(c.weather_code),d=WX.daily,hr=WX.hourly,ti=todayIdx(),ahead=lookAhead(),view=S.wxView||(ahead?'days':'hours');
  const hl=ti<0?'':ahead&&ti+1<d.time.length?'Low tonight '+rnd(d.temperature_2m_min[ti+1])+'°':'High '+rnd(d.temperature_2m_max[ti])+'°, low '+rnd(d.temperature_2m_min[ti])+'°';
  let h='<div class="g-wx">'+icon(l[1],c.is_day!==0)+'<div class="t">'+rnd(c.temperature_2m)+'°</div><div class="c"><b>'+esc(l[0])+'</b>'+hl+'</div></div>',cells='';
  if(view==='days'&&ti>=0){for(let i=ti+1;i<=ti+5&&i<d.time.length;i++){const pp=d.precipitation_probability_max[i]||0;
      cells+='<span class="cell"><span>'+DAYS[dowOf(d.time[i])].name.slice(0,3)+'</span>'+icon(WMO(d.weather_code[i])[1],true)+'<b>'+rnd(d.temperature_2m_max[i])+'°</b><span class="lo">'+rnd(d.temperature_2m_min[i])+'°</span><span class="pp">'+(pp>=20?pp+'%':'')+'</span></span>'}
    h+=seg('days')+'<button class="g-strip" data-act="wxview" data-v="hours" aria-label="Next five days. Tap for the next hours.">'+cells+'</button>'}
  else if(hr&&hr.time){const i0=hr.time.indexOf(S.today+'T'+pad(new Date().getHours())+':00');
    if(i0>=0){for(let i=i0+1;i<=i0+9&&i<hr.time.length;i+=2){const H=+hr.time[i].slice(11,13),pp=hr.precipitation_probability[i];
        cells+='<span class="cell"><span>'+((H%12)||12)+(H<12?' am':' pm')+'</span>'+icon(WMO(hr.weather_code[i])[1],H>=7&&H<19)+'<b>'+rnd(hr.temperature_2m[i])+'°</b><span class="pp">'+(pp>=20?pp+'%':'')+'</span></span>'}
      h+=seg('hours')+'<button class="g-strip" data-act="wxview" data-v="days" aria-label="Next hours. Tap for the next five days.">'+cells+'</button>'}}
  return h}
// the clothing tip is about the walk to school: name the 8 am temperature of the day it covers
function tipView(){if(!WX)return '';const ahead=lookAhead(),t=new Date();if(!ahead&&t.getHours()+t.getMinutes()/60>=10.5)return '';if(S.timers.length&&leaveInfo())return '';const hint=dressHint(ahead?1:0);if(!hint)return '';
  const hr=WX.hourly,am=hr&&hr.time?hr.time.indexOf((ahead?addDays(S.today,1):S.today)+'T08:00'):-1;
  const lead=(ahead?'Tomorrow, ':'')+(am>=0?rnd(hr.temperature_2m[am])+'° at drop-off.':'');
  return '<div class="g-tip">'+SHIRT+'<div>'+(lead?'<b>'+lead+'</b> ':'')+esc(hint)+'.</div></div>'}
function glanceView(){const ahead=lookAhead(),ND=DAYS[dowOf(addDays(S.today,1))],D=DAYS[dowOf(S.today)];
  return '<section class="glance" aria-label="Time and weather"><div class="g-date">'+parse(S.today).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</div>'+

    (tomorrowMode()?'':'<div class="g-focus">'+(ahead?'Tomorrow: '+esc(ND.focus.charAt(0).toLowerCase()+ND.focus.slice(1)):'Today: '+esc(D.focus.charAt(0).toLowerCase()+D.focus.slice(1)))+'</div>')+
    wxGlance()+(tomorrowMode()?'':tipView())+'<div class="g-mid" id="gmid">'+midView()+'</div><div class="g-sky" id="sun"'+(S.timers.length||leaveInfo()?' hidden':'')+'>'+sunBlock()+'</div></section>'}

/* ---------- kitchen timers, the leave-the-house countdown, and dated countdowns ---------- */
const fmtLeft=ms=>{const t=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60;return (h?h+':'+pad(m):m)+':'+pad(x)};
function leaveInfo(){const sc=P.sched;if(!sc.leave||!(sc.school||[]).includes(dowOf(S.today))||dayData(S.today).sideways)return null;
  if(CAL.events.some(e=>e.day===S.today&&e.cat==='hol'))return null;
  const [H,M]=sc.leave.split(':').map(Number),t=parse(S.today);t.setHours(H,M,0,0);
  const left=t-Date.now();return left>-5*60000&&left<=60*60000?{left,label:P.leaveLabel||'Leave the house'}:null}
function countdowns(){return lines(P.events,'v').map(r=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(r[1]);if(!m)return null;const days=Math.round((parse(r[1])-parse(S.today))/864e5);return days>=0&&days<=60?{days,name:r[2]||'Countdown'}:null}).filter(Boolean).sort((a,b)=>a.days-b.days).slice(0,2)}
function midView(){let h='';const lv=leaveInfo();
  if(lv)h+=lv.left>0?'<div class="g-leave"><b id="gleave">'+Math.ceil(lv.left/60000)+' min</b><span>to '+esc(lv.label.charAt(0).toLowerCase()+lv.label.slice(1))+'</span></div>'
    :'<div class="g-leave go"><b>Time to go</b><span>'+esc(lv.label)+'</span></div>';
  S.timers.forEach(tm=>{h+='<div class="g-timer"><b id="tm-'+tm.id+'">'+fmtLeft(tm.end-Date.now())+'</b><span>'+esc(tm.label)+'</span><button class="tadd" data-act="tplus" data-id="'+tm.id+'" aria-label="Add a minute">+1 min</button><button class="tadd" data-act="tstop" data-id="'+tm.id+'" aria-label="Cancel timer">×</button></div>'});
  if(!S.timers.length)countdowns().forEach(c=>{h+='<div class="g-count"><b>'+(c.days===0?'Today':c.days===1?'Tomorrow':c.days+' days')+'</b><span>'+(c.days>1?'until ':'')+esc(c.name)+'</span></div>'});
  h+='<div class="g-tbtns" role="group" aria-label="Start a timer"><span>Timer</span>'+[1,5,10,15,30].map(m=>'<button data-act="tstart" data-m="'+m+'" aria-label="'+m+' minute timer">'+m+(m===1?' min':'')+'</button>').join('')+'</div>';
  return h}
function refreshMid(){const gm=document.getElementById('gmid'),sky=document.getElementById('sun');if(!gm)return;const h=midView();
  if(h.replace(/<b id="tm-[^"]+">[^<]*<\/b>/g,'')!==(gm._sig||'')){gm.innerHTML=h;gm._sig=h.replace(/<b id="tm-[^"]+">[^<]*<\/b>/g,'')}

// A list shows whole rows only: rows that don't fit are hidden behind a "+N more" link to Chores.
function fitLists(){document.querySelectorAll('.now .list').forEach(L=>{const rows=[...L.children].filter(n=>n.classList.contains('ck'));if(!rows.length)return;
  rows.forEach(r=>r.hidden=false);const old=L.querySelector('.more');if(old)old.remove();if(L.scrollHeight<=L.clientHeight+1)return;
  const room=L.clientHeight-52;let shown=0;for(const r of rows){if(r.offsetTop-L.offsetTop+r.offsetHeight<=room)shown++;else break}
  rows.slice(Math.max(1,shown)).forEach(r=>r.hidden=true);const n=rows.length-Math.max(1,shown);
  L.insertAdjacentHTML('beforeend','<button class="jc add more" data-act="openday" data-d="'+S.today+'">+'+n+' more ›</button>')})}
addEventListener('resize',()=>requestAnimationFrame(fitLists));
// a chip row that is wider than the pane drops its last job chips into the "+N more" count
function fitChips(){document.querySelectorAll('.now .jcs').forEach(R=>{let guard=6;while(R.scrollWidth>R.clientWidth+1&&guard--){const more=R.querySelector('.jc.more'),jobs=[...R.querySelectorAll('.jc[data-act="opengroup"]')];if(!jobs.length)break;
  jobs[jobs.length-1].remove();if(more){more.textContent='+'+(parseInt(more.textContent.slice(1))+1)+' more ›'}else{const side=R.querySelector('.side');(side||null);R.insertAdjacentHTML('beforeend','<button class="jc more" data-act="openday" data-d="'+S.today+'">+1 more ›</button>')}}})}

function tick(){const t=new Date(),el=document.getElementById('time');if(el)el.innerHTML=clockHTML();

  const mi=Math.floor(Date.now()/60000);if(S.amb&&mi!==S.driftM){S.driftM=mi;const wide=!!document.querySelector('.ambient.dark'),fx=wide?.3:.16,fy=wide?.28:.12;
    r.setProperty('--ax',Math.round((Math.random()*2-1)*innerWidth*fx)+'px');r.setProperty('--ay',Math.round((Math.random()*2-1)*innerHeight*fy)+'px')}
  if(S.amb){const isDark=!!document.querySelector('.ambient.dark');if(isDark!==overnight())render()}
  if(!INART&&t.getHours()===3&&!S.timers.length&&!S.ring&&lsGet('hub-reloaded','')!==iso(t)){lsSet('hub-reloaded',iso(t));location.reload();return}
  if(S.ambOn&&!S.amb&&!S.sheet&&!S.timers.length&&!S.ring&&(t.getHours()>=21||t.getHours()<5)&&Date.now()-lastAct>180000&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))){S.amb=true;render()}
  const sun=document.getElementById('sun');if(sun)sun.innerHTML=sunBlock();
  refreshMid();

  const now=iso(t),ri=routineIdx(t);
  if(now!==S.today){const wasToday=S.sel===S.today;S.today=now;if(wasToday)S.sel=now;syncSubs();if(MCP)watchCals();S._ri=ri;render();return}
  const idle=Date.now()-lastAct,dayHrs=t.getHours()>=5&&t.getHours()<21,dk=document.querySelector('.dock');if(dk)dk.classList.toggle('idle',idle>120000&&!S.sheet);
  if(S.dimOn&&dayHrs&&!S.dim&&!S.amb&&!S.sheet&&!scanStream&&!S.timers.length&&!S.ring&&!leaveInfo()&&idle>1200000&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))){S.dim=true;render();return}
  if(S.dim&&(!dayHrs||S.amb)){S.dim=false;render();return}
  if(S._ri!==ri){S._ri=ri;render();return}
  // meals and the clothing tip switch at 10:30 am and 7:30 pm; past events drop off the schedule every 15 minutes
  const hr=t.getHours()+t.getMinutes()/60,mk=(lookAhead(t)?'e':hr<10.5?'m':'d')+Math.floor(t.getMinutes()/15);
  if(S._mk!==mk){const first=S._mk==null;S._mk=mk;if(!first&&!S.sheet&&!S.amb)render()}}
